<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #d1d7db;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background-color: #efeae2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Header Styles */
        .header {
            background-color: #008069;
            color: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: #dfe5e7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            overflow: hidden;
        }

        .avatar svg {
            width: 25px;
            height: 25px;
            fill: #fff;
        }

        .contact-info {
            flex-grow: 1;
        }

        .contact-name {
            font-size: 16px;
            font-weight: 500;
        }

        .file-upload-label {
            font-size: 12px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .file-upload-label:hover {
            background: rgba(255,255,255,0.3);
        }

        #fileInput {
            display: none;
        }

        /* Chat Background */
        .chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            display: flex;
            flex-direction: column;
        }

        /* Message Bubbles */
        .message-row {
            display: flex;
            margin-bottom: 12px;
            width: 100%;
        }

        .message-row.sent {
            justify-content: flex-end;
        }

        .message-row.received {
            justify-content: flex-start;
        }

        .message-row.system {
            justify-content: center;
        }

        .message {
            max-width: 75%;
            padding: 6px 7px 8px 9px;
            border-radius: 7px;
            position: relative;
            font-size: 14.2px;
            line-height: 19px;
            color: #111b21;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
        }

        .message.sent {
            background-color: #d9fdd3;
            border-top-right-radius: 0;
        }

        .message.received {
            background-color: #ffffff;
            border-top-left-radius: 0;
        }

        .message.system {
            background-color: #ffeebd;
            color: #54656f;
            font-size: 12.5px;
            border-radius: 10px;
            padding: 5px 12px;
            text-align: center;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.05);
            max-width: 90%;
        }

        .sender-name {
            font-size: 12.5px;
            font-weight: 500;
            color: #1fa855;
            margin-bottom: 2px;
        }

        .time {
            font-size: 11px;
            color: #667781;
            float: right;
            margin-top: 5px;
            margin-left: 15px;
            line-height: 15px;
        }

        .media-omitted {
            display: flex;
            align-items: center;
            color: #54656f;
            font-style: italic;
        }
        .media-omitted span {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="avatar">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="contact-info">
            <div class="contact-name" id="contactName">Loading...</div>
        </div>
        <label class="file-upload-label" for="fileInput">Import Chat</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div class="chat-container" id="chatContainer">
        <!-- Messages will be injected here -->
    </div>
</div>

<script>
    // Hardcoded chat data from the prompt
    const defaultChatData = `25/08/2026, 10:26 am - Messages and calls are end-to-end encrypted. Only people in this chat can read, listen to, or share them. *Learn more*
22/09/2026, 9:09 am - Chandrashekhar: 10 bje hai
22/09/2026, 9:09 am - Sandeep Mns IIIT A: Thik he
23/09/2026, 10:51 pm - Chandrashekhar: 10.39.236.226
23/09/2026, 10:52 pm - Chandrashekhar: ./client <ip> <port> receive.txt
23/09/2026, 10:52 pm - Chandrashekhar: 8080
23/09/2026, 11:27 pm - Chandrashekhar: Chor kl dekhenge
24/09/2026, 12:24 am - Sandeep Mns IIIT A: Haan
11/11/2026, 3:49 pm - Chandrashekhar: Be call kyu kar rha
11/11/2026, 3:49 pm - Chandrashekhar: Tera awaz nahi aa rha
11/11/2026, 3:56 pm - Sandeep Mns IIIT A: Phle sign ke liye kiya tha double me galti se jab me lag gya
11/11/2026, 3:57 pm - Chandrashekhar: Oh main to ghrpe hu yaar
11/11/2026, 3:57 pm - Sandeep Mns IIIT A: Haa smjh gya tha me
17/11/2026, 12:43 pm - Sandeep Mns IIIT A: <Media omitted>
17/11/2026, 3:09 pm - Chandrashekhar: <Media omitted>
18/11/2026, 5:11 pm - Sandeep Mns IIIT A: Bhai lab gya ho toh meri proxy lgwa dena yr
18/11/2026, 5:19 pm - Chandrashekhar: Attendance nahi ho rha hai
18/11/2026, 5:19 pm - Sandeep Mns IIIT A: Thik h
18/11/2026, 5:19 pm - Sandeep Mns IIIT A: Plag check ho rha he kya
18/11/2026, 5:19 pm - Chandrashekhar: Vo bola khud se check krke upload krdo
18/11/2026, 5:20 pm - Sandeep Mns IIIT A: Ok`;

    function parseAndRenderChat(text) {
        const container = document.getElementById('chatContainer');
        container.innerHTML = ''; 

        const lines = text.split('\n');
        
        // Regex to capture WhatsApp format: DD/MM/YYYY, HH:MM am/pm - Name: Message
        const msgRegex = /^(\d{2}\/\d{2}\/\d{4}),\s([\d:]+\s?[a-zA-Z\u202F]+)\s-\s(.*?):\s(.*)$/;
        // Regex for system messages without colon (e.g. End-to-end encrypted)
        const sysRegex = /^(\d{2}\/\d{2}\/\d{4}),\s([\d:]+\s?[a-zA-Z\u202F]+)\s-\s(.*)$/;

        let uniqueUsers = new Set();
        let parsedMessages = [];

        // First Pass: Scan the file to find the names of the people chatting
        lines.forEach(line => {
            if (!line.trim()) return;

            const msgMatch = line.match(msgRegex);
            if (msgMatch) {
                const sender = msgMatch[3];
                uniqueUsers.add(sender); // Collect the names dynamically
                parsedMessages.push({ type: 'message', data: msgMatch });
            } else {
                const sysMatch = line.match(sysRegex);
                if (sysMatch) {
                    parsedMessages.push({ type: 'system', data: sysMatch });
                } else {
                    parsedMessages.push({ type: 'raw', data: line });
                }
            }
        });

        // Determine who is who based on the scanned names
        const usersArray = Array.from(uniqueUsers);
        
        // The first person found in the chat is assigned as the "Right Side" (Sender)
        const mainUser = usersArray.length > 0 ? usersArray[0] : "Me";
        
        // The second person found is assigned as the "Left Side" (Receiver/Contact)
        const contactName = usersArray.length > 1 ? usersArray[1] : (usersArray[0] || "Unknown Contact");

        // Update the header UI with the automatically detected contact name
        document.getElementById('contactName').innerText = contactName;

        // Second Pass: Render the messages with the dynamically assigned roles
        parsedMessages.forEach(item => {
            let rowDiv = document.createElement('div');
            rowDiv.classList.add('message-row');

            let msgDiv = document.createElement('div');
            msgDiv.classList.add('message');

            if (item.type === 'message') {
                const time = item.data[2];
                const sender = item.data[3];
                let content = item.data[4];

                // Handle Media Omitted
                if (content.includes("<Media omitted>")) {
                    content = `<div class="media-omitted"><span>📷</span> Media not available</div>`;
                }

                // If sender matches the main user we detected, put on right (green)
                if (sender === mainUser) {
                    rowDiv.classList.add('sent');
                    msgDiv.classList.add('sent');
                } else {
                    // Otherwise put on left (white)
                    rowDiv.classList.add('received');
                    msgDiv.classList.add('received');
                }

                msgDiv.innerHTML = `${content} <span class="time">${time}</span>`;
            } else if (item.type === 'system') {
                const content = item.data[3];
                rowDiv.classList.add('system');
                msgDiv.classList.add('system');
                msgDiv.innerHTML = `🔒 ${content}`;
            } else {
                // Continuation lines of previous messages
                rowDiv.classList.add('system');
                msgDiv.classList.add('system');
                msgDiv.innerHTML = item.data;
            }

            rowDiv.appendChild(msgDiv);
            container.appendChild(rowDiv);
        });

        // Scroll to the bottom of the chat automatically
        container.scrollTop = container.scrollHeight;
    }

    // Initialize with default chat data on page load
    window.onload = () => parseAndRenderChat(defaultChatData);

    // Handle user file upload: re-run the parse function on the new file's text
    document.getElementById('fileInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                parseAndRenderChat(e.target.result);
            };
            reader.readAsText(file);
        }
    });
</script>
</body>
</html>
